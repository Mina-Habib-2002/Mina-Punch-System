<!DOCTYPE html>
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#080f1e"><title>Mina Punch System</title>
<style>
:root{color-scheme:dark;--bg:#080f1e;--panel:#141e30;--line:#2a3850;--muted:#9cabc1;--blue:#60b9ff;--text:#f6f9ff}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden}body{font-family:system-ui,-apple-system,Segoe UI,sans-serif;background:var(--bg);color:var(--text)}.app{height:100vh;height:100dvh;width:100%;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) max(14px,env(safe-area-inset-right)) max(12px,env(safe-area-inset-bottom)) max(14px);gap:clamp(8px,1.3dvh,16px);overflow:hidden}.header{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:none}.brand{font-size:clamp(18px,3.3vw,25px);font-weight:800;letter-spacing:-.7px}.brand b{color:var(--blue)}.sub{font-size:clamp(10px,1.6dvh,13px);color:var(--muted);margin-top:2px}.status{font-size:12px;color:#81ddb2;white-space:nowrap}.status:before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:#81ddb2;margin-right:7px}.qr-area{flex:1 1 auto;min-height:0;display:flex;align-items:center;justify-content:center}.qr-shell{aspect-ratio:1;max-height:100%;max-width:min(100%,470px);height:auto;width:auto;display:flex;align-items:center;justify-content:center;padding:clamp(8px,1.4vmin,15px);border-radius:16px;background:#fff}.qr-shell canvas,.qr-shell img{width:100%!important;height:100%!important;display:block;image-rendering:pixelated}.qr-shell #q{width:100%;height:100%;display:flex;align-items:center;justify-content:center}.bottom{flex:none;display:flex;flex-direction:column;gap:clamp(7px,1.2dvh,12px)}.timestamp{border:1px solid var(--line);border-radius:14px;background:#10192a;text-align:center;padding:clamp(8px,1.2dvh,14px) 8px}.eyebrow{font-size:10px;font-weight:750;letter-spacing:1.8px;color:var(--muted)}#time{font-size:clamp(18px,4.7vw,30px);font-weight:700;font-variant-numeric:tabular-nums;letter-spacing:.3px;margin-top:3px;white-space:nowrap}.settings{display:grid;grid-template-columns:1fr;gap:8px}.field-head{display:flex;justify-content:space-between;align-items:center;gap:8px;color:var(--muted);font-size:12px}.date-row{display:flex;gap:8px}.date-row input{flex:1;min-width:0}.input,button{font:inherit;color:var(--text);background:#10192a;border:1px solid var(--line);border-radius:11px;height:40px;padding:0 12px}.input:focus-visible,button:focus-visible,input[type=range]:focus-visible{outline:2px solid var(--blue);outline-offset:2px}button{background:#263b56;cursor:pointer;font-weight:600}.interval-row{display:flex;align-items:center;gap:12px}input[type=range]{width:100%;min-width:0;flex:1;accent-color:var(--blue);height:26px;cursor:pointer}input[type=number]{width:75px;text-align:center;font-variant-numeric:tabular-nums}.count{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}.count strong{color:var(--text)}.track{height:5px;background:#27364b;border-radius:100px;overflow:hidden}.fill{height:100%;width:100%;background:var(--blue);transition:width .15s linear}.hint{text-align:center;color:#73859e;font-size:10px} @media(min-width:760px) and (orientation:landscape){.app{max-width:1200px;margin:auto;display:grid;grid-template-columns:minmax(0,1fr) minmax(300px,.85fr);grid-template-rows:auto 1fr;column-gap:clamp(20px,5vw,70px)}.header{grid-column:1/-1}.qr-area{grid-column:1;grid-row:2}.bottom{grid-column:2;grid-row:2;justify-content:center}.qr-shell{max-height:100%;max-width:100%}}@media(max-height:570px) and (orientation:portrait){.app{gap:5px;padding-top:7px;padding-bottom:7px}.sub,.hint{display:none}.timestamp{padding:5px}.input,button{height:33px}.bottom{gap:5px}.settings{gap:5px}.qr-shell{padding:7px}.eyebrow{font-size:9px}}@media(max-height:400px) and (orientation:landscape){.hint,.sub{display:none}.app{gap:5px}.timestamp{padding:5px}.input,button{height:32px}}
</style></head><body><main class="app"><header class="header"><div><div class="brand">Mina Punch <b>System</b></div><div class="sub">Live timestamp QR</div></div><div class="status" id="status">Active</div></header><section class="qr-area" id="qrArea"><div class="qr-shell" id="qrShell"><div id="q" aria-label="Timestamp QR code"></div></div></section><section class="bottom"><div class="timestamp"><div class="eyebrow">CURRENT TIME</div><div id="time">--</div></div><div class="settings"><div class="field-head"><label for="date">QR date</label></div><div class="date-row"><input class="input" id="date" type="text" inputmode="numeric" placeholder="DD/MM/YYYY" maxlength="10" aria-label="QR date DD/MM/YYYY"><button id="today" type="button">Today</button></div><div class="field-head"><label for="slider">QR refresh interval</label><span id="intervalLabel">10 seconds</span></div><div class="interval-row"><input id="slider" type="range" min="1" max="120" step="1" value="10" aria-label="QR refresh interval in seconds"><input class="input" id="seconds" type="number" min="1" max="3600" step="1" value="10" aria-label="QR refresh interval in seconds"></div></div><div class="count"><span>Next QR update</span><strong id="countdown">10s</strong></div><div class="track"><div class="fill" id="fill"></div></div><div class="hint">QR encodes DD/MM/YYYY HH:mm:ss</div></section></main>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script><script>
(()=>{'use strict';const $=id=>document.getElementById(id),date=$('date'),slider=$('slider'),seconds=$('seconds'),label=$('intervalLabel'),time=$('time'),countdown=$('countdown'),fill=$('fill'),q=$('q'),shell=$('qrShell'),area=$('qrArea');const pad=n=>String(n).padStart(2,'0');const day=d=>`${pad(d.getDate())}/${pad(d.getMonth()+1)}/${d.getFullYear()}`;const validDate=v=>{const m=/^(\d{2})\/(\d{2})\/(\d{4})$/.exec(v);if(!m)return false;const d=new Date(+m[3],+m[2]-1,+m[1]);return d.getFullYear()===+m[3]&&d.getMonth()===+m[2]-1&&d.getDate()===+m[1]};const normalizeDate=v=>{if(validDate(v))return v;const m=/^(\d{4})-(\d{2})-(\d{2})$/.exec(v);if(m){const x=`${m[3]}/${m[2]}/${m[1]}`;if(validDate(x))return x}return day(new Date())};const clock=d=>`${pad(d.getHours())}:${pad(d.getMinutes())}:${pad(d.getSeconds())}`;let interval=10, nextUpdate=0,qr=null,lastValue='',lastSize=0;try{date.value=normalizeDate(localStorage.getItem('qrDate')||'')}catch(e){date.value=day(new Date())}function renderQR(value){if(typeof QRCode==='undefined'){q.textContent='QR library unavailable';q.style.color='#111';$('status').textContent='QR unavailable';return}const size=Math.max(100,Math.floor(Math.min(shell.clientWidth,shell.clientHeight)-2*parseFloat(getComputedStyle(shell).paddingLeft)));if(!qr||size!==lastSize){q.innerHTML='';qr=new QRCode(q,{text:value,width:size,height:size,colorDark:'#080f1e',colorLight:'#ffffff',correctLevel:QRCode.CorrectLevel.M});lastSize=size}else{qr.makeCode(value)}lastValue=value}function updateQR(now){renderQR(`${validDate(date.value)?date.value:day(now)} ${clock(now)}`)}function reset(){nextUpdate=Date.now()+interval*1000;updateQR(new Date());tick()}function setIntervalSeconds(value){let n=Math.round(Number(value));if(!Number.isFinite(n))n=10;n=Math.max(1,Math.min(3600,n));interval=n;try{localStorage.setItem('qrInterval',String(n))}catch(e){}seconds.value=n;slider.value=Math.min(120,n);label.textContent=n===1?'1 second':`${n} seconds`;reset()}slider.addEventListener('input',()=>setIntervalSeconds(slider.value));seconds.addEventListener('change',()=>setIntervalSeconds(seconds.value));seconds.addEventListener('keydown',e=>{if(e.key==='Enter'){seconds.blur();setIntervalSeconds(seconds.value)}});date.addEventListener('change',()=>{if(!validDate(date.value)){date.setCustomValidity('Enter a valid date as DD/MM/YYYY');date.reportValidity();return}date.setCustomValidity('');try{localStorage.setItem('qrDate',date.value)}catch(e){}reset()});date.addEventListener('input',()=>date.setCustomValidity(''));$('today').addEventListener('click',()=>{date.value=day(new Date());try{localStorage.setItem('qrDate',date.value)}catch(e){}reset()});function tick(){const now=new Date();time.textContent=`${validDate(date.value)?date.value:day(now)} ${clock(now)}`;if(Date.now()>=nextUpdate){nextUpdate=Date.now()+interval*1000;updateQR(now)}const remaining=Math.max(0,nextUpdate-Date.now());countdown.textContent=`${Math.ceil(remaining/1000)}s`;fill.style.width=`${Math.max(0,Math.min(100,remaining/(interval*1000)*100))}%`}function sizeQR(){const available=area.getBoundingClientRect();const size=Math.max(0,Math.floor(Math.min(available.width,available.height,470)));shell.style.width=size+'px';shell.style.height=size+'px';if(lastValue&&size>0)renderQR(lastValue)}if('ResizeObserver'in window){new ResizeObserver(sizeQR).observe(area)}else window.addEventListener('resize',sizeQR);sizeQR();let saved=10;try{saved=Number(localStorage.getItem('qrInterval'))||10}catch(e){}setIntervalSeconds(saved);setInterval(tick,200);document.addEventListener('visibilitychange',()=>{if(!document.hidden){sizeQR();tick()}})})();
</script></body></html>
